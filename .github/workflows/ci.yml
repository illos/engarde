name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify corpus certification stamp
        run: pnpm corpus:verify
      - name: Test
        run: pnpm test
      - name: Test ruling tools
        run: pnpm test:tools
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
